<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Package Builder</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Search Section */
        .search-container {
            position: relative;
            margin-bottom: 2rem;
        }

        #testSearch {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            outline: none;
        }

        #testSearch:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        #resultsList {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .result-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background-color: var(--accent);
        }

        .result-item .category {
            font-size: 0.75rem;
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 99px;
        }

        /* Cart Section */
        .cart-section {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .selected-tests {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .test-chip {
            background: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            animation: fadeIn 0.2s ease-out;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Table Section */
        .summary-section {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .tier-col {
            text-align: left;
            font-weight: 600;
            background: var(--accent);
        }

        .total-cell {
            font-weight: 700;
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Utility */
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Custom Package Builder</h1>
        <p>Select tests to calculate total package pricing across all tiers</p>
    </header>

    <div class="search-container">
        <input type="text" id="testSearch" placeholder="Search for a test or parameter (e.g. Zinc, AEC)..." autocomplete="off">
        <div id="resultsList"></div>
    </div>

    <div class="cart-section" id="cartSection">
        <div class="cart-header">
            <span class="cart-title">Selected Tests (<span id="testCount">0</span>)</span>
            <button id="clearAll" style="background:none; border:none; color:var(--primary); cursor:pointer; font-size:0.9rem;">Clear All</button>
        </div>
        <div id="selectedContainer" class="selected-tests">
            <!-- Selected chips go here -->
            <div class="empty-state" id="emptyCart">No tests added yet.</div>
        </div>
    </div>

    <div class="summary-section">
        <table>
            <thead>
                <tr>
                    <th>Tier / Level</th>
                    <th>Level 1 (Max)</th>
                    <th>Level 2 (Avg)</th>
                    <th>Level 3 (Min)</th>
                </tr>
            </thead>
            <tbody id="pricingBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
</div>

    let selectedTests = [];

    const searchInput = document.getElementById('testSearch');
    const resultsList = document.getElementById('resultsList');
    const selectedContainer = document.getElementById('selectedContainer');
    const testCountLabel = document.getElementById('testCount');
    const pricingBody = document.getElementById('pricingBody');
    const emptyCart = document.getElementById('emptyCart');

    // Initialize search
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
            resultsList.style.display = 'none';
            return;
        }

        const matches = Object.keys(TEST_DATA).filter(name => 
            name.toLowerCase().includes(query) && !selectedTests.includes(name)
        );

        if (matches.length > 0) {
            resultsList.innerHTML = matches.map(name => `
                <div class="result-item" onclick="addTest('${name}')">
                    <span>${name}</span>
                    <span class="category">${TEST_DATA[name].Category}</span>
                </div>
            `).join('');
            resultsList.style.display = 'block';
        } else {
            resultsList.style.display = 'none';
        }
    });

    // Close results when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
            resultsList.style.display = 'none';
        }
    });

    window.addTest = function(name) {
        if (!selectedTests.includes(name)) {
            selectedTests.push(name);
            updateUI();
        }
        searchInput.value = '';
        resultsList.style.display = 'none';
    };

    window.removeTest = function(name) {
        selectedTests = selectedTests.filter(t => t !== name);
        updateUI();
    };

    document.getElementById('clearAll').addEventListener('click', () => {
        selectedTests = [];
        updateUI();
    });

    function updateUI() {
        // Update Chips
        if (selectedTests.length === 0) {
            selectedContainer.innerHTML = '<div class="empty-state">No tests added yet.</div>';
        } else {
            selectedContainer.innerHTML = selectedTests.map(name => `
                <div class="test-chip">
                    <span>${name}</span>
                    <button class="remove-btn" onclick="removeTest('${name}')">&times;</button>
                </div>
            `).join('');
        }

        testCountLabel.textContent = selectedTests.length;
        calculatePricing();
    }

    function calculatePricing() {
        const tiers = [1, 2, 3, 4, 5, 6];
        const levels = [
            { id: 1, key: "Maximum" },
            { id: 2, key: "Average" },
            { id: 3, key: "Minimum" }
        ];

        let html = '';

        tiers.forEach(tier => {
            html += `<tr><td class="tier-col">Tier ${tier}</td>`;
            
            levels.forEach(level => {
                let total = 0;
                selectedTests.forEach(testName => {
                    const test = TEST_DATA[testName];
                    const priceKey = `B2C Selling Price - Level ${level.id} (Tier ${tier}) (${level.key})`;
                    total += test[priceKey] || 0;
                });
                html += `<td class="total-cell">${total > 0 ? '₹' + total.toLocaleString() : '-'}</td>`;
            });

            html += `</tr>`;
        });

        pricingBody.innerHTML = html;
    }

    // Initial table render
    calculatePricing();
